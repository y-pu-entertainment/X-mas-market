  .wait{font-size:13px;color:#6b746f;line-height:1.7;margin-top:12px}

<div class="wrap">
  <h1 class="page">ボランティア活動証明書</h1>
  <p class="sub">ABCクリスマスマーケット2026 supported by ホームメイト</p>

  <div class="card" id="formCard">

  </div>

  <div class="card" id="resCard" style="display:none">
    <p class="who" id="who"></p>
    <div id="list"></div>
    <div class="wait" id="wait"></div>
  </div>

  <p class="note">
    ※証明書は1人1枚です。全日程の終了後に、受付が完了した活動日をすべて記載して発行します。<br>
    ※管理IDは、申込完了時や運営事務局からのメールに記載されています。<br>
    ※うまく表示されない場合は、管理IDを添えて ypu@y-pu.co.jp までご連絡ください。
  </p>
</div>

var state = null;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function jsonp(params) {
  return new Promise(function (resolve, reject) {
    var cb = 'certcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    var s = document.createElement('script');
    var timer = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = function (data) { cleanup(); resolve(data); };
    var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    s.src = API + '?' + q + '&callback=' + cb;
    s.onerror = function () { cleanup(); reject(new Error('network')); };
    document.body.appendChild(s);
  });
}

function showErr(msg) {
  var el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

document.getElementById('go').addEventListener('click', function () {
  var id = document.getElementById('mid').value.trim();
  var name = document.getElementById('nm').value.trim();
  if (!id || !name) { showErr('管理IDとお名前を入力してください。'); return; }
  showErr('');
  var btn = this;
  btn.disabled = true; btn.textContent = '確認しています…';
  jsonp({ action: 'cert', id: id, name: name }).then(function (res) {
    if (!res || !res.success) { showErr((res && res.message) || '確認できませんでした。'); return; }
    state = res;
    renderList();
  }).catch(function () {
    showErr('通信に失敗しました。時間をおいて再度お試しください。');
  }).then(function () {
    btn.disabled = false; btn.textContent = '証明書を表示する';
  });
});

function renderList() {
  var v = VENUE[state.venue];
  document.getElementById('who').innerHTML = '<b>' + esc(state.name) + '</b> 様（' + esc(v.place) + '）';
  var list = document.getElementById('list');
  if (!state.ready) {
    list.innerHTML = '<p class="who">証明書は、全日程の終了後に発行できます。<br>' +
      '最終日：<b>' + esc(state.lastDateLabel) + '</b>（受付済 ' + state.doneCount + ' / ' + state.totalCount + ' 日）</p>';
  } else if (!state.certs.length) {
    list.innerHTML = '<p class="who">発行できる証明書はありません。</p>';
  } else {
    list.innerHTML = state.certs.map(function (c, i) {
      return '<div class="item"><span class="d">活動証明書（' + c.dayCount + '日分）</span>' +
        '<button class="dl" style="background:' + v.accent + '" data-i="' + i + '">PDFをダウンロード</button></div>' +
        '<p class="wait" style="margin-top:4px">記載する活動日：' + esc(c.dateText) + '</p>';
    }).join('');
  }
  var notes = [];
  if (state.waiting.length) notes.push('受付確認待ち：' + state.waiting.map(esc).join('、'));
  if (state.missed.length) notes.push('受付記録がない日：' + state.missed.map(esc).join('、') + '<br>（参加していた場合は、管理IDを添えて ypu@y-pu.co.jp までご連絡ください）');
  document.getElementById('wait').innerHTML = notes.join('<br>');
  document.getElementById('resCard').style.display = 'block';
  Array.prototype.forEach.call(list.querySelectorAll('.dl'), function (b) {
    b.addEventListener('click', function () { download(Number(b.getAttribute('data-i')), b); });
  });
}

function loadFonts(text) {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  var specs = ['900 46px "Noto Serif JP"', '700 34px "Noto Serif JP"', '700 19px "Noto Serif JP"',
               '400 16px "Noto Sans JP"', '700 15px "Noto Sans JP"'];
  return Promise.all(specs.map(function (s) { return document.fonts.load(s, text).catch(function () {}); }))
    .then(function () { return document.fonts.ready; });
}

/* ---------- 画像化（外部ライブラリなし） ----------
 * レイアウトはブラウザに任せ（ラフ案と同じHTML）、各要素・各文字の位置を測ってcanvasに描く。 */
function isTransparent(c) {
  return !c || c === 'transparent' || /rgba\(.*,\s*0\)$/.test(c);
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function paintToCanvas(node, scale) {
  var root = node.getBoundingClientRect();
  var canvas = document.createElement('canvas');
  canvas.width = Math.round(root.width * scale);
  canvas.height = Math.round(root.height * scale);
  var ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, root.width, root.height);

  var els = [node].concat(Array.prototype.slice.call(node.querySelectorAll('*')));
  els.forEach(function (el) {
    var cs = getComputedStyle(el);
    var r = el.getBoundingClientRect();
    var x = r.left - root.left, y = r.top - root.top, w = r.width, h = r.height;
    var rad = parseFloat(cs.borderTopLeftRadius) || 0;

    if (!isTransparent(cs.backgroundColor)) {
      ctx.fillStyle = cs.backgroundColor;
      roundRectPath(ctx, x, y, w, h, rad);
      ctx.fill();
    }

    var bw = ['Top', 'Right', 'Bottom', 'Left'].map(function (s) {
      return cs['border' + s + 'Style'] === 'none' ? 0 : (parseFloat(cs['border' + s + 'Width']) || 0);
    });
    if (bw[0] && bw[0] === bw[1] && bw[1] === bw[2] && bw[2] === bw[3]) {
      ctx.strokeStyle = cs.borderTopColor;
      ctx.lineWidth = bw[0];
      roundRectPath(ctx, x + bw[0] / 2, y + bw[0] / 2, w - bw[0], h - bw[0], Math.max(0, rad - bw[0] / 2));
      ctx.stroke();
    } else {
      if (bw[0]) { ctx.fillStyle = cs.borderTopColor; ctx.fillRect(x, y, w, bw[0]); }
      if (bw[1]) { ctx.fillStyle = cs.borderRightColor; ctx.fillRect(x + w - bw[1], y, bw[1], h); }
      if (bw[2]) { ctx.fillStyle = cs.borderBottomColor; ctx.fillRect(x, y + h - bw[2], w, bw[2]); }
      if (bw[3]) { ctx.fillStyle = cs.borderLeftColor; ctx.fillRect(x, y, bw[3], h); }
    }

    if (el.tagName === 'IMG') {
      ctx.drawImage(el, x, y, w, h);
    }
  });

  /* 文字：1文字ずつ位置を測って描く（字間・改行・中央揃えもラフ案どおり） */
  var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null);
  var range = document.createRange();
  var t;
  while ((t = walker.nextNode())) {
    var cs = getComputedStyle(t.parentNode);
    ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    ctx.fillStyle = cs.color;
    ctx.textBaseline = 'alphabetic';
    var text = t.nodeValue;
    var i = 0;
    while (i < text.length) {
      var code = text.codePointAt(i);
      var len = code > 0xffff ? 2 : 1;
      var ch = text.substr(i, len);
      if (!/\s/.test(ch)) {
        range.setStart(t, i);
        range.setEnd(t, i + len);
        var rects = range.getClientRects();
        if (rects.length) {
          var rr = rects[0];
          var m = ctx.measureText(ch);
          var asc = m.fontBoundingBoxAscent || parseFloat(cs.fontSize) * 0.88;
          var desc = m.fontBoundingBoxDescent || parseFloat(cs.fontSize) * 0.12;
          var baseline = rr.top - root.top + (rr.height - (asc + desc)) / 2 + asc;
          ctx.fillText(ch, rr.left - root.left, baseline);
        }
      }
      i += len;
    }
  }
  return canvas;
}

/* JPEG 1枚を A4横 に貼った PDF を作る */
function jpegToPdf(jpegBytes, iw, ih) {
  var enc = new TextEncoder();
  var parts = [];
  var offsets = [];
  var size = 0;
  function add(x) {
    var b = typeof x === 'string' ? enc.encode(x) : x;
    parts.push(b);
    size += b.length;
  }
  var W = 841.89, H = 595.28;
  var content = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q';
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  offsets[1] = size; add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = size; add('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offsets[3] = size; add('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');
  offsets[4] = size; add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + iw + ' /Height ' + ih +
    ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpegBytes.length + ' >>\nstream\n');
  add(jpegBytes); add('\nendstream\nendobj\n');
  offsets[5] = size; add('5 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream\nendobj\n');
  var xref = size;
  var x = 'xref\n0 6\n0000000000 65535 f \n';
  for (var k = 1; k <= 5; k++) x += String(offsets[k]).padStart(10, '0') + ' 00000 n \n';
  add(x + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}

function dataUrlToBytes(url) {
  var bin = atob(url.split(',')[1]);
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function saveBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

function download(i, btn) {
  var v = VENUE[state.venue];
  var c = state.certs[i];
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = '作成中…';
  var stage = document.getElementById('stage');
  stage.innerHTML = certHtml(v, c);
  var node = stage.firstChild;
  var img = node.querySelector('img');
  var imgReady = img.complete ? Promise.resolve() : new Promise(function (r) { img.onload = r; img.onerror = r; });
  Promise.all([loadFonts(node.textContent), imgReady]).then(function () {
    var canvas = paintToCanvas(node, 2.5);
    var jpeg = dataUrlToBytes(canvas.toDataURL('image/jpeg', 0.95));
    saveBlob(jpegToPdf(jpeg, canvas.width, canvas.height), 'ボランティア活動証明書_' + c.certNo + '.pdf');
  }).catch(function () {
    showErr('作成に失敗しました。時間をおいて再度お試しください。');
  }).then(function () {
    stage.innerHTML = '';
    btn.disabled = false; btn.textContent = label;
  });
}
